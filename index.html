<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Book - Product & Vouch Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, rgba(20, 10, 15, 0.7), rgba(30, 15, 22, 0.85)), 
                        url('https://raw.githubusercontent.com/mainemail021415-coder/product-tracker/refs/heads/main/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(35, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 114, 182, 0.35);
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.2), inset 0 0 15px rgba(244, 114, 182, 0.05);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(244, 114, 182, 0.65);
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.4), inset 0 0 20px rgba(244, 114, 182, 0.1);
        }

        .glass-nav {
            background: rgba(25, 12, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .bubble-glow-text {
            font-weight: 800;
            color: #ffe4e6;
            text-shadow: 
                0 0 8px rgba(255, 105, 180, 0.9),
                0 0 15px rgba(255, 182, 193, 0.7),
                0 0 25px rgba(255, 20, 147, 0.5);
            letter-spacing: 1.5px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(20, 10, 15, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(244, 114, 182, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(244, 114, 182, 0.7); }
    </style>
</head>
<body class="text-pink-100 min-h-screen flex flex-col selection:bg-pink-500 selection:text-white">

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
        <div class="glass-card rounded-3xl w-full max-w-md p-8 shadow-2xl border border-pink-500/40 text-center space-y-6">
            <div class="flex justify-center">
                <img src="https://raw.githubusercontent.com/mainemail021415-coder/product-tracker/refs/heads/main/logo%20(2).png" alt="Shop Book Logo" class="h-20 object-contain drop-shadow-[0_0_12px_rgba(244,114,182,0.6)]">
            </div>
            <div>
                <h2 class="text-2xl font-bold tracking-wide text-pink-200">Admin Portal</h2>
                <p class="text-xs text-pink-300/70 mt-1">Enter your unique admin password</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-medium text-pink-300/80 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required placeholder="Enter password..." class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-4 py-3 text-sm text-pink-100 placeholder-pink-300/40 focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition">
                    </div>
                </div>
                <div id="loginError" class="text-xs text-rose-400 hidden">Incorrect password. Please try again.</div>
                <button type="submit" class="w-full bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white font-medium py-3 rounded-xl text-sm transition shadow-lg shadow-pink-600/30 border border-pink-400/40 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Dashboard
                </button>
            </form>
            <div class="text-xs text-pink-300/50 pt-2">
                Telegram: <a href="https://t.me/peony03" target="_blank" class="text-sky-300 hover:underline">@peony03</a>
            </div>
        </div>
    </div>

    <!-- ================= MAIN DASHBOARD (Hidden until logged in) ================= -->
    <div id="mainDashboard" class="hidden flex-col min-h-screen">
        <!-- Header -->
        <header class="glass-nav sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-4">
                    <img src="https://raw.githubusercontent.com/mainemail021415-coder/product-tracker/refs/heads/main/logo%20(2).png" alt="Shop Book Logo" class="h-14 sm:h-16 object-contain drop-shadow-[0_0_10px_rgba(244,114,182,0.5)]">
                    <span class="bubble-glow-text text-lg sm:text-2xl tracking-wider uppercase">Monitorings</span>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                    <span id="adminBadge" class="bg-pink-950/60 border border-pink-500/30 text-pink-200 px-3 py-1.5 rounded-xl text-xs font-semibold hidden sm:inline-block"></span>
                    <a href="https://t.me/peony03" target="_blank" class="bg-gradient-to-r from-sky-400 to-sky-500 hover:from-sky-500 hover:to-sky-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-md shadow-sky-500/30 border border-sky-300/30">
                        <i class="fa-brands fa-telegram text-lg"></i> @peony03
                    </a>
                    <button onclick="exportData()" class="glass-card hover:bg-pink-900/40 text-pink-200 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5" title="Export Backup">
                        <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Backup</span>
                    </button>
                    <button onclick="handleLogout()" class="bg-rose-950/60 hover:bg-rose-900 text-rose-200 border border-rose-500/30 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5" title="Logout">
                        <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Container -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

            <!-- Stat Summary Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="glass-card p-4 rounded-2xl">
                    <p class="text-xs text-pink-300/70 font-medium">Onhand Products</p>
                    <h3 id="stat-onhand" class="text-2xl font-bold text-pink-300 mt-1">0</h3>
                </div>
                <div class="glass-card p-4 rounded-2xl">
                    <p class="text-xs text-pink-300/70 font-medium">Sold Items</p>
                    <h3 id="stat-sold" class="text-2xl font-bold text-rose-300 mt-1">0</h3>
                </div>
                <div class="glass-card p-4 rounded-2xl">
                    <p class="text-xs text-pink-300/70 font-medium">Pending Orders</p>
                    <h3 id="stat-pending" class="text-2xl font-bold text-amber-300 mt-1">0</h3>
                </div>
                <div class="glass-card p-4 rounded-2xl">
                    <p class="text-xs text-pink-300/70 font-medium">Total Vouches</p>
                    <h3 id="stat-vouches" class="text-2xl font-bold text-pink-400 mt-1">0</h3>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <div class="flex border-b border-pink-500/20 overflow-x-auto scrollbar-none">
                <button onclick="switchTab('onhand')" id="tab-btn-onhand" class="tab-btn px-6 py-3 font-semibold text-sm border-b-2 border-pink-400 text-pink-300 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-box-open"></i> Onhand Products
                </button>
                <button onclick="switchTab('sold')" id="tab-btn-sold" class="tab-btn px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-pink-300/60 hover:text-pink-200 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-circle-check"></i> Sold Items
                </button>
                <button onclick="switchTab('pending')" id="tab-btn-pending" class="tab-btn px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-pink-300/60 hover:text-pink-200 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-clock"></i> Pending Orders
                </button>
                <button onclick="switchTab('vouches')" id="tab-btn-vouches" class="tab-btn px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-pink-300/60 hover:text-pink-200 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-star"></i> Vouches & Proofs
                </button>
            </div>

            <!-- TAB CONTENT CONTAINER -->
            <div class="glass-card rounded-2xl p-5 shadow-2xl">
                
                <!-- CONTROLS & ADD BUTTON -->
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                    <div class="w-full sm:w-72">
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search records..." class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-4 py-2 text-sm text-pink-100 placeholder-pink-300/40 focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition">
                    </div>
                    <button onclick="openModal()" class="w-full sm:w-auto bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-pink-600/30 flex items-center justify-center gap-2 border border-pink-400/40">
                        <i class="fa-solid fa-plus"></i> Add New Record
                    </button>
                </div>

                <!-- TABLE VIEW -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" id="mainTable">
                        <thead>
                            <tr id="tableHeaders" class="border-b border-pink-500/20 text-xs font-semibold text-pink-300/70 uppercase tracking-wider">
                                <!-- Dynamically populated headers -->
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-pink-500/10 text-sm text-pink-100/90">
                            <!-- Dynamically populated rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="glass-nav py-4 mt-auto">
            <div class="max-w-7xl mx-auto px-4 text-center text-xs text-pink-300/70">
                Shop Book Tracker &bull; Contact Telegram <a href="https://t.me/peony03" target="_blank" class="text-sky-300 font-medium hover:underline">@peony03</a>
            </div>
        </footer>
    </div>

    <!-- MODAL FORM -->
    <div id="recordModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl border border-pink-500/40">
            <div class="px-6 py-4 border-b border-pink-500/20 flex justify-between items-center bg-pink-950/30">
                <h3 id="modalTitle" class="font-bold text-lg text-pink-200">Add Record</h3>
                <button onclick="closeModal()" class="text-pink-300/60 hover:text-pink-100"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="recordForm" onsubmit="saveRecord(event)" class="p-6 space-y-4">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-xs font-medium text-pink-300/80 mb-1">Product / Item Name</label>
                    <input type="text" id="f-name" required class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-3 py-2 text-sm text-pink-100 focus:outline-none focus:border-pink-400">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-pink-300/80 mb-1">Quantity / Details</label>
                        <input type="text" id="f-qty" required class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-3 py-2 text-sm text-pink-100 focus:outline-none focus:border-pink-400" placeholder="e.g. 5 pcs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-pink-300/80 mb-1">Price / Amount (₱)</label>
                        <input type="number" step="0.01" id="f-price" required class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-3 py-2 text-sm text-pink-100 focus:outline-none focus:border-pink-400" placeholder="0.00">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-pink-300/80 mb-1" id="label-extra">Customer / Notes / Reference</label>
                    <input type="text" id="f-extra" required class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-3 py-2 text-sm text-pink-100 focus:outline-none focus:border-pink-400" placeholder="Customer name or vouch link">
                </div>
                <div>
                    <label class="block text-xs font-medium text-pink-300/80 mb-1">Date</label>
                    <input type="date" id="f-date" required class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-3 py-2 text-sm text-pink-100 focus:outline-none focus:border-pink-400">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-pink-950/50 hover:bg-pink-900/50 border border-pink-500/30 text-pink-200 px-4 py-2 rounded-xl text-sm font-medium transition">Cancel</button>
                    <button type="submit" class="bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-pink-600/30 border border-pink-400/30">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        // ======= MULTI-ADMIN CONFIGURATION =======
        // Dito mo ilalagay ang mga iba't ibang admin at ang kanilang kanya-kayang password at storage key:
        const ADMIN_ACCOUNTS = {
            "peony03": { name: "Admin Peony", storageKey: "shopbook_db_peony" },
            "admin123": { name: "Admin Store 1", storageKey: "shopbook_db_store1" },
            "manager99": { name: "Admin Manager", storageKey: "shopbook_db_manager" }
            // Pwede kang magdagdag pa rito ng iba kung gusto mo!
        };

        let currentAdmin = null;
        let db = { onhand: [], sold: [], pending: [], vouches: [] };
        let currentTab = 'onhand';

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (ADMIN_ACCOUNTS[pass]) {
                currentAdmin = ADMIN_ACCOUNTS[pass];
                sessionStorage.setItem('shopbook_current_password', pass);
                
                // Load specific database for this admin
                loadAdminDatabase();
                
                document.getElementById('loginScreen').classList.add('hidden');
                const mainDash = document.getElementById('mainDashboard');
                mainDash.classList.remove('hidden');
                mainDash.classList.add('flex');
                
                document.getElementById('adminBadge').innerText = `👤 ${currentAdmin.name}`;
                renderTable();
            } else {
                errorEl.classList.remove('hidden');
                document.getElementById('loginPassword').value = '';
            }
        }

        function loadAdminDatabase() {
            if (!currentAdmin) return;
            let savedData = localStorage.getItem(currentAdmin.storageKey);
            if (savedData) {
                db = JSON.parse(savedData);
            } else {
                // Default starter data if empty
                db = {
                    onhand: [{ name: 'Sample Item A', qty: '10 pcs', price: 250, extra: 'Main Stock', date: '2026-10-27' }],
                    sold: [{ name: 'Sample Item B', qty: '2 pcs', price: 500, extra: 'Juan Dela Cruz', date: '2026-10-26' }],
                    pending: [{ name: 'Sample Item C', qty: '1 pc', price: 350, extra: 'Maria Santos', date: '2026-10-27' }],
                    vouches: [{ name: 'Legit Seller Vouch', qty: 'Fast Deal', price: 0, extra: 'https://t.me/peony03', date: '2026-10-25' }]
                };
                saveDataToStorage();
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('shopbook_current_password');
            location.reload();
        }

        window.onload = () => {
            const savedPass = sessionStorage.getItem('shopbook_current_password');
            if (savedPass && ADMIN_ACCOUNTS[savedPass]) {
                currentAdmin = ADMIN_ACCOUNTS[savedPass];
                loadAdminDatabase();
                document.getElementById('loginScreen').classList.add('hidden');
                const mainDash = document.getElementById('mainDashboard');
                mainDash.classList.remove('hidden');
                mainDash.classList.add('flex');
                document.getElementById('adminBadge').innerText = `👤 ${currentAdmin.name}`;
                renderTable();
            }
        };

        function saveDataToStorage() {
            if (currentAdmin) {
                localStorage.setItem(currentAdmin.storageKey, JSON.stringify(db));
            }
            renderTable();
            updateStats();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-pink-400', 'text-pink-300');
                btn.classList.add('border-transparent', 'text-pink-300/60');
            });
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            activeBtn.classList.remove('border-transparent', 'text-pink-300/60');
            activeBtn.classList.add('border-pink-400', 'text-pink-300');

            const extraLabel = document.getElementById('label-extra');
            if (tab === 'sold') extraLabel.innerText = 'Buyer Name / Remarks';
            else if (tab === 'pending') extraLabel.innerText = 'Customer / Status Details';
            else if (tab === 'vouches') extraLabel.innerText = 'Proof Link / Platform';
            else extraLabel.innerText = 'Location / Notes';

            renderTable();
        }

        function updateStats() {
            document.getElementById('stat-onhand').innerText = db.onhand.length;
            document.getElementById('stat-sold').innerText = db.sold.length;
            document.getElementById('stat-pending').innerText = db.pending.length;
            document.getElementById('stat-vouches').innerText = db.vouches.length;
        }

        function renderTable() {
            const headers = document.getElementById('tableHeaders');
            const tbody = document.getElementById('tableBody');
            const searchInput = document.getElementById('searchInput');
            const searchVal = searchInput ? searchInput.value.toLowerCase() : '';

            let extraTitle = 'Notes';
            if (currentTab === 'sold') extraTitle = 'Buyer';
            if (currentTab === 'pending') extraTitle = 'Customer / Status';
            if (currentTab === 'vouches') extraTitle = 'Proof Link';

            headers.innerHTML = `
                <th class="py-3 px-4">Item Name</th>
                <th class="py-3 px-4">Qty / Details</th>
                <th class="py-3 px-4">Price (₱)</th>
                <th class="py-3 px-4">${extraTitle}</th>
                <th class="py-3 px-4">Date</th>
                <th class="py-3 px-4 text-right">Actions</th>
            `;

            const items = db[currentTab] || [];
            tbody.innerHTML = '';

            const filtered = items.filter(item => 
                item.name.toLowerCase().includes(searchVal) || 
                item.extra.toLowerCase().includes(searchVal)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-pink-300/50">No records found.</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                const originalIndex = items.indexOf(item);
                let extraContent = item.extra;
                if (currentTab === 'vouches' && item.extra.startsWith('http')) {
                    extraContent = `<a href="${item.extra}" target="_blank" class="text-sky-300 hover:underline"><i class="fa-solid fa-link"></i> View Proof</a>`;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-pink-900/20 transition">
                        <td class="py-3.5 px-4 font-medium text-pink-100">${item.name}</td>
                        <td class="py-3.5 px-4 text-pink-200/80">${item.qty}</td>
                        <td class="py-3.5 px-4 font-semibold text-rose-300">₱${Number(item.price).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        <td class="py-3.5 px-4 text-pink-200/80">${extraContent}</td>
                        <td class="py-3.5 px-4 text-pink-300/60 text-xs">${item.date}</td>
                        <td class="py-3.5 px-4 text-right space-x-2">
                            <button onclick="editRecord(${originalIndex})" class="text-pink-300/70 hover:text-pink-200 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteRecord(${originalIndex})" class="text-pink-300/70 hover:text-rose-400 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            updateStats();
        }

        function filterTable() {
            renderTable();
        }

        function openModal(isEdit = false) {
            document.getElementById('recordModal').classList.remove('hidden');
            document.getElementById('recordModal').classList.add('flex');
            if (!isEdit) {
                document.getElementById('modalTitle').innerText = `Add New ${currentTab.slice(0,-1).toUpperCase()}`;
                document.getElementById('recordForm').reset();
                document.getElementById('editIndex').value = '';
                document.getElementById('f-date').valueAsDate = new Date();
            }
        }

        function closeModal() {
            document.getElementById('recordModal').classList.remove('flex');
            document.getElementById('recordModal').classList.add('hidden');
        }

        function saveRecord(e) {
            e.preventDefault();
            const editIdx = document.getElementById('editIndex').value;
            const newItem = {
                name: document.getElementById('f-name').value,
                qty: document.getElementById('f-qty').value,
                price: parseFloat(document.getElementById('f-price').value) || 0,
                extra: document.getElementById('f-extra').value,
                date: document.getElementById('f-date').value
            };

            if (editIdx === '') {
                db[currentTab].push(newItem);
            } else {
                db[currentTab][editIdx] = newItem;
            }

            saveDataToStorage();
            closeModal();
        }

        function editRecord(index) {
            const item = db[currentTab][index];
            document.getElementById('modalTitle').innerText = `Edit Record`;
            document.getElementById('editIndex').value = index;
            document.getElementById('f-name').value = item.name;
            document.getElementById('f-qty').value = item.qty;
            document.getElementById('f-price').value = item.price;
            document.getElementById('f-extra').value = item.extra;
            document.getElementById('f-date').value = item.date;
            openModal(true);
        }

        function deleteRecord(index) {
            if (confirm('Are you sure you want to delete this record?')) {
                db[currentTab].splice(index, 1);
                saveDataToStorage();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `shop_book_${currentAdmin.storageKey}.json`);
            dlAnchorElem.click();
        }
    </script>
</body>
</html>
